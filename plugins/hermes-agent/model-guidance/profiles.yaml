# model-guidance 映射表：模型 → 模型族与默认模式。
# rules 自上而下首个命中生效；match 为模型名子串（不区分大小写）。
# 未命中的模型不注入模型族块；用 `/guide` 设了会话或全局模式时只注入模式块。

main_platforms: [webui, cli, tui]

rules:
  - match: [gpt-6.1-sol]
    family: openai
    default_mode: long
  - match: [gpt-, codex]
    family: openai
    default_mode: daily
  # 模型组级固定提示词：命中即注入 families.deepseek 的正文；不写 default_mode 就不叠模式块。
  - match: [deepseek]
    family: deepseek

families:
  openai:
    main: prompts/family/openai.md
    worker: prompts/family/worker.md
  deepseek:
    main: prompts/family/deepseek.md
    worker: prompts/family/worker.md

modes:
  long: prompts/mode/long.md
  daily: prompts/mode/daily.md
